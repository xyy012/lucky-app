<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>中奖率预测</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --green-50:#f3faf4; --green-100:#e8f5e9; --green-200:#c8e6c9; --green-300:#a5d6a7;
  --green-500:#4caf50; --green-600:#43a047; --green-700:#388e3c; --green-800:#2e7d32;
  --blue-500:#3f83f8; --blue-600:#3572e8;
  --text:#1f2937; --muted:#7b8794; --danger:#e53935; --danger-bg:#fdecea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--green-100);color:var(--text);min-height:100vh;padding-bottom:80px;font-size:15px;
}
.app-header{
  position:sticky;top:0;z-index:30;background:var(--green-500);color:#fff;
  padding:13px 14px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.app-header h1{font-size:19px;margin:0;flex:1;text-align:center;font-weight:600;}
.btn-back{background:rgba(255,255,255,.25);border:none;color:#fff;font-size:14px;padding:6px 12px;border-radius:8px;width:56px;}
main{padding:14px;max-width:560px;margin:0 auto;}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(46,125,50,.08);}
.list-item{display:flex;align-items:center;gap:10px;}
.li-main{flex:1;min-width:0;}
.li-title{font-size:16px;font-weight:600;overflow-wrap:break-word;}
.li-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.li-prob{text-align:right;flex-shrink:0;}
.prob-num{font-size:24px;font-weight:700;color:var(--green-700);}
.prob-num.zero{color:var(--muted);}
/* 按钮 */
.btn{border:none;border-radius:10px;padding:9px 14px;font-size:14px;background:#eef2f6;color:var(--text);cursor:pointer;}
.btn:active{opacity:.75;}
.btn-primary{background:var(--green-500);color:#fff;font-weight:600;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:var(--green-100);color:var(--green-800);}
.btn-danger-ghost{background:var(--danger-bg);color:var(--danger);}
.btn-block{display:block;width:100%;margin-top:6px;padding:12px;font-size:15px;}
/* 特征选择 */
.feat-group{margin-bottom:12px;}
.feat-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-50);border:1.5px solid var(--green-200);color:var(--text);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;}
.chip.active{background:var(--green-500);border-color:var(--green-500);color:#fff;font-weight:600;}
.chip-static{padding:5px 10px;font-size:13px;}
/* 录音 */
.chip-play{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.10);font-size:10px;line-height:1;}
.chip.active .chip-play{background:rgba(255,255,255,.30);}
.rec-entry{margin-top:8px;}
.rec-card{margin-top:12px;padding:12px;border:1.5px dashed var(--green-300);border-radius:12px;background:var(--green-50);}
.rec-status{font-size:13.5px;color:var(--text);margin:10px 0 8px;min-height:20px;}
.rec-actions{display:flex;flex-wrap:wrap;gap:8px;}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:6px;animation:recblink 1s infinite;}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.25}}
.rec-warn{margin-top:8px;font-size:12.5px;color:var(--danger);background:var(--danger-bg);padding:7px 10px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip-x{border:none;background:rgba(0,0,0,.08);color:inherit;border-radius:50%;width:18px;height:18px;line-height:1;font-size:13px;padding:0;cursor:pointer;}
/* 方格 */
.grid-wrap{display:flex;justify-content:center;margin:10px 0;}
.grid{position:relative;display:grid;gap:4px;padding:4px;background:#fff;border:1.5px solid var(--blue-600);border-radius:10px;width:min(100%,220px);}
.grid-cell{background:var(--blue-500);border-radius:4px;aspect-ratio:1;min-height:52px;}
.grid-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;pointer-events:none;}
.grid-center .gc-line{font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);font-weight:600;max-width:90%;overflow-wrap:break-word;}
.grid-center .gc-prob{font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.grid-hint{text-align:center;color:var(--muted);font-size:13px;padding:18px 0;background:var(--green-50);border-radius:10px;}
/* 批次列表中的方格缩略图 */
.grid-thumb{width:84px;gap:3px;padding:3px;border-radius:8px;flex-shrink:0;margin-left:2px;}
.grid-thumb .grid-cell{min-height:0;border-radius:3px;}
.grid-thumb-empty{width:84px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--green-50);border:1.5px dashed var(--green-200);border-radius:8px;color:var(--muted);font-size:12px;flex-shrink:0;}
.li-prob-line{margin-top:4px;display:flex;align-items:baseline;gap:6px;}
.li-prob-line .prob-num{font-size:18px;}
.result-card{text-align:center;}
.result-card .prob-num{font-size:30px;margin-top:6px;}
.result-card .li-sub{margin:4px 0 10px;}
.hint{font-size:12px;color:var(--muted);}
.hint.center{text-align:center;margin-top:6px;}
/* 徽标 */
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;}
.badge-win{background:var(--green-100);color:var(--green-800);}
.badge-lose{background:var(--danger-bg);color:var(--danger);}
/* 空状态 */
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;line-height:1.9;}
.stats{text-align:center;color:var(--green-800);font-weight:600;}
/* 分析页 */
.rule-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;margin-top:6px;}
.rule-item.win{background:var(--green-100);}
.rule-item.lose{background:var(--danger-bg);}
.rule-text{font-size:14px;font-weight:600;overflow-wrap:break-word;}
.rule-item.win .rule-text{color:var(--green-800);}
.rule-item.lose .rule-text{color:var(--danger);}
.rule-count{font-size:12px;color:var(--muted);flex-shrink:0;}
.order-item{margin-top:10px;}
.order-head{font-size:14px;font-weight:600;display:flex;align-items:center;}
.order-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--green-500);color:#fff;font-size:11px;margin-right:6px;flex-shrink:0;}
.order-vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.order-val{background:var(--green-50);border:1px solid var(--green-200);border-radius:8px;padding:4px 9px;font-size:12.5px;}
.order-val b{color:var(--green-800);}
/* 输入 */
.add-row{display:flex;gap:8px;margin-top:10px;}
.input{flex:1;border:1.5px solid var(--green-200);border-radius:10px;padding:8px 12px;font-size:14px;outline:none;background:#fff;min-width:0;}
.input:focus{border-color:var(--green-500);}
/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--green-200);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;border:none;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);cursor:pointer;}
.tabbar button .tab-icon{display:block;font-size:21px;margin-bottom:2px;}
.tabbar button.active{color:var(--green-700);font-weight:600;}
/* 弹窗 */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.hidden{display:none;}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:320px;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:10px;}
.modal-msg{font-size:14px;color:var(--text);margin-bottom:16px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
/* 提示条 */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:85%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header class="app-header">
  <button class="btn-back" id="backBtn" style="display:none">‹ 返回</button>
  <h1 id="headerTitle">批次</h1>
  <div style="width:56px"></div>
</header>
<main id="app"></main>
<nav class="tabbar">
  <button data-tab="batches"><span class="tab-icon">📦</span>批次</button>
  <button data-tab="library"><span class="tab-icon">📚</span>样本库</button>
  <button data-tab="analysis"><span class="tab-icon">📊</span>分析</button>
  <button data-tab="settings"><span class="tab-icon">⚙️</span>设置</button>
</nav>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modalBox"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<input type="file" id="audioFiles" accept="audio/*" multiple style="display:none">
<div id="toast"></div>
<script>
'use strict';
/* ================= 数据存储 ================= */
var LS_KEY='luckyApp.v1';
var DEFAULT_PRESETS={
  sounds:['a','b','c','d','e','f','g','h','i','j','k'],
  styles:['1*2','2*2','2*3'],
  itemTypes:['收藏品','仪器仪表','生活用品','医疗用品','纸制品','电子产品','工具','军用杂物','能源物品','建筑材料']
};
var store=loadStore();
function loadStore(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){
      var d=JSON.parse(raw);
      return {
        presets:Object.assign({},DEFAULT_PRESETS,d.presets||{}),
        samples:Array.isArray(d.samples)?d.samples:[],
        batches:Array.isArray(d.batches)?d.batches:[],
        recordings:(d.recordings&&typeof d.recordings==='object')?d.recordings:{},
        updatedAt:typeof d.updatedAt==='number'?d.updatedAt:0
      };
    }
  }catch(e){console.warn(e);}
  return {presets:Object.assign({},DEFAULT_PRESETS),samples:[],batches:[],recordings:{},updatedAt:0};
}
function persistStore(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(store));}
  catch(e){toast('保存失败：'+e.message);}
}
function saveStore(noSync){
  store.updatedAt=Date.now();
  persistStore();
  if(!noSync&&getToken())scheduleUpload();
}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(ts){var d=new Date(ts);var p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function fmtProb(p){var v=Math.round(p*10000)/100;return (v%1===0?v.toFixed(0):v.toFixed(2))+'%';}

/* ================= 页面状态 ================= */
var view={name:'batches'};
var formState=null;
var modalCb=null;
var app=document.getElementById('app');

function getBatch(){return store.batches.find(function(b){return b.id===view.batchId;});}
function getItem(){var b=getBatch();return b?b.items.find(function(i){return i.id===view.itemId;}):null;}

/* ================= 概率计算 ================= */
function calcProb(checked){
  var keys=['sound','style','orientation','itemType'].filter(function(k){return checked[k];});
  var matched=store.samples.filter(function(s){
    return keys.every(function(k){return s[k]===checked[k];});
  });
  var wins=matched.filter(function(s){return s.win;}).length;
  return {total:matched.length,wins:wins,prob:matched.length?wins/matched.length:0};
}
function chipVals(group,checked){
  var vals=store.presets[group].slice();
  if(checked&&vals.indexOf(checked)<0)vals.unshift(checked);
  return vals;
}

/* ================= 视图渲染 ================= */
function render(){
  document.getElementById('modalBackdrop').classList.add('hidden');modalCb=null;
  var hd=document.getElementById('headerTitle');
  var back=document.getElementById('backBtn');
  if(view.name==='batches'){hd.textContent='批次';back.style.display='none';app.innerHTML=viewBatches();}
  else if(view.name==='batch'){hd.textContent='批次详情';back.style.display='';app.innerHTML=viewBatch();}
  else if(view.name==='item'){hd.textContent='样品'+itemIndex();back.style.display='';app.innerHTML=viewItem();}
  else if(view.name==='library'){hd.textContent='样本库';back.style.display='none';app.innerHTML=viewLibrary();}
  else if(view.name==='form'){hd.textContent=view.editSampleId?'编辑样本':'录入样本';back.style.display='';app.innerHTML=viewForm();}
  else if(view.name==='analysis'){hd.textContent='分析';back.style.display='none';app.innerHTML=viewAnalysis();}
  else if(view.name==='settings'){hd.textContent='设置';back.style.display='none';app.innerHTML=viewSettings();}
  else if(view.name==='rec'){hd.textContent='声音录音';back.style.display='';app.innerHTML=viewRec();}
  var tabMap={batches:'batches',batch:'batches',item:'batches',library:'library',form:'library',analysis:'analysis',settings:'settings',rec:'settings'};
  document.querySelectorAll('.tabbar button').forEach(function(b){
    b.classList.toggle('active',b.dataset.tab===tabMap[view.name]);
  });
}
function itemIndex(){var b=getBatch();return b?b.items.findIndex(function(i){return i.id===view.itemId;})+1:0;}

function viewBatches(){
  var list=store.batches.slice().sort(function(a,b){return b.createdAt-a.createdAt;});
  var html=list.length?list.map(function(b){
    return '<div class="card list-item" data-action="openBatch" data-id="'+b.id+'">'
      +'<div class="li-main"><div class="li-title">'+esc(b.name)+'</div>'
      +'<div class="li-sub">'+b.items.length+' 个样品 · '+fmtTime(b.createdAt)+'</div></div>'
      +'<button class="btn btn-danger-ghost" data-action="delBatch" data-id="'+b.id+'">删除</button></div>';
  }).join(''):'<div class="empty">还没有批次<br>点击下方按钮新建一个吧</div>';
  return html+'<button class="btn btn-primary btn-block" data-action="addBatch">＋ 新建批次</button>';
}

function viewBatch(){
  var b=getBatch();
  var items=b.items.length?b.items.map(function(it,i){return itemCard(it,i);}).join('')
    :'<div class="empty">还没有样品<br>点击下方按钮添加样品1</div>';
  return '<div class="card" style="text-align:center">'
    +'<div class="li-title">'+esc(b.name)+'</div>'
    +'<div class="li-sub">共 '+b.items.length+' 个样品</div>'
    +'<button class="btn btn-danger-ghost btn-block" data-action="delBatch" data-id="'+b.id+'">删除整个批次</button></div>'
    +items
    +'<button class="btn btn-primary btn-block" data-action="addItem">＋ 添加样品'+(b.items.length+1)+'</button>';
}
function itemCard(it,i){
  var r=calcProb(it.checked);
  var feats=['sound','style','orientation','itemType'].map(function(k){return it.checked[k];}).filter(Boolean);
  var thumb;
  if(it.checked.style&&it.checked.orientation){
    thumb=renderGridThumb(it.checked);
  }else if(it.checked.style){
    thumb='<div class="grid-thumb-empty">未选横竖</div>';
  }else{
    thumb='<div class="grid-thumb-empty">未选样式</div>';
  }
  return '<div class="card list-item" data-action="openItem" data-id="'+it.id+'">'
    +'<div class="li-main"><div class="li-title">样品'+(i+1)+'</div>'
    +'<div class="li-sub">'+(feats.length?feats.join(' · '):'未勾选特征')+'</div>'
    +'<div class="li-prob-line"><span class="prob-num'+(r.prob>0?'':' zero')+'">'+fmtProb(r.prob)+'</span>'
    +'<span class="li-sub">匹配'+r.total+'·中奖'+r.wins+'</span></div></div>'
    +thumb
    +'<button class="btn btn-danger-ghost" data-action="delItem" data-id="'+it.id+'">删除</button></div>';
}

function viewItem(){
  var it=getItem();
  if(!it)return '';
  var feats=[
    {key:'sound',label:'声音',vals:chipVals('sounds',it.checked.sound)},
    {key:'style',label:'样式',vals:chipVals('styles',it.checked.style)},
    {key:'orientation',label:'横竖',vals:['横','竖']},
    {key:'itemType',label:'物品类型（可不选）',vals:chipVals('itemTypes',it.checked.itemType)}
  ];
  var r=calcProb(it.checked);
  var groups=feats.map(function(f){
    var isSound=(f.key==='sound');
    return '<div class="feat-group"><div class="feat-label">'+f.label+'</div><div class="chips">'
      +f.vals.map(function(v){
        return '<button class="chip'+(it.checked[f.key]===v?' active':'')+'" data-action="toggleFeat" data-key="'+f.key+'" data-val="'+esc(v)+'">'+esc(v)+(isSound?recChipPlay(v):'')+'</button>';
      }).join('')+'</div>'+(isSound?recEntry():'')+'</div>';
  }).join('')+recCard();
  var grid;
  if(it.checked.style&&it.checked.orientation){
    grid=renderGrid(it.checked,fmtProb(r.prob));
  }else if(it.checked.style){
    grid='<div class="grid-hint">再选择「横竖」即可显示方格</div>';
  }else{
    grid='<div class="grid-hint">选择「样式」和「横竖」即可显示方格</div>';
  }
  return '<div class="card">'+groups+'</div>'
    +'<div class="card result-card">'+grid
    +'<div class="prob-num'+(r.prob>0?'':' zero')+'">'+fmtProb(r.prob)+'</div>'
    +'<div class="li-sub">匹配 '+r.total+' 条 · 中奖 '+r.wins+' 条</div>'
    +'<div class="hint">勾选即自动保存，返回后可在批次中查看</div></div>';
}
function renderGrid(checked,probStr){
  var dims=String(checked.style).split('*').map(Number);
  var cols=checked.orientation==='竖'?dims[0]:dims[1];
  var rows=checked.orientation==='竖'?dims[1]:dims[0];
  var cells='<div class="grid-cell"></div>'.repeat(cols*rows);
  var mid='';
  if(checked.itemType)mid+='<div class="gc-line">'+esc(checked.itemType)+'</div>';
  if(checked.sound)mid+='<div class="gc-line">声音 '+esc(checked.sound)+'</div>';
  mid+='<div class="gc-prob">'+probStr+'</div>';
  return '<div class="grid-wrap"><div class="grid" style="grid-template-columns:repeat('+cols+',1fr)">'
    +cells+'<div class="grid-center">'+mid+'</div></div></div>';
}
function renderGridThumb(checked){
  var dims=String(checked.style).split('*').map(Number);
  var cols=checked.orientation==='竖'?dims[0]:dims[1];
  var rows=checked.orientation==='竖'?dims[1]:dims[0];
  var cells='<div class="grid-cell"></div>'.repeat(cols*rows);
  return '<div class="grid grid-thumb" style="grid-template-columns:repeat('+cols+',1fr)">'+cells+'</div>';
}

function viewLibrary(){
  var n=store.samples.length;
  var w=store.samples.filter(function(s){return s.win;}).length;
  var list=n?store.samples.slice().reverse().map(function(s){
    return '<div class="card list-item">'
      +'<div class="li-main"><div class="li-title">'+esc(s.sound)+' · '+esc(s.style)+' · '+esc(s.orientation)+(s.itemType?' · '+esc(s.itemType):'')+'</div>'
      +'<div class="li-sub"><span class="badge '+(s.win?'badge-win':'badge-lose')+'">'+(s.win?'✓ 中奖':'✗ 未中奖')+'</span></div></div>'
      +(hasRec(s.sound)?'<button class="btn btn-ghost" data-action="playRec" data-val="'+esc(s.sound)+'">▶</button>':'')
      +'<button class="btn btn-ghost" data-action="editSample" data-id="'+s.id+'">编辑</button>'
      +'<button class="btn btn-danger-ghost" data-action="delSample" data-id="'+s.id+'">删除</button></div>';
  }).join(''):'<div class="empty">样本库还是空的<br>录入样本后，预测才会越来越准</div>';
  return '<div class="card stats">共 '+n+' 条样本 · 中奖 '+w+' 条 · 总中奖率 '+fmtProb(n?w/n:0)+'</div>'
    +list+'<button class="btn btn-primary btn-block" data-action="addSample">＋ 录入样本</button>';
}

function viewForm(){
  if(!formState)formState={sound:null,style:null,orientation:null,itemType:null,win:null};
  var cur=formState;
  var groups=[
    {key:'sound',label:'声音',vals:chipVals('sounds',cur.sound)},
    {key:'style',label:'样式',vals:chipVals('styles',cur.style)},

    {key:'itemType',label:'物品类型（可不选）',vals:chipVals('itemTypes',cur.itemType)},
    {key:'win',label:'是否中奖',vals:['中奖','未中奖']}
  ];
  var html=groups.map(function(g){
    var isSound=(g.key==='sound');
    return '<div class="feat-group"><div class="feat-label">'+g.label+'</div><div class="chips">'
      +g.vals.map(function(v){
        return '<button class="chip'+(cur[g.key]===v?' active':'')+'" data-action="formPick" data-key="'+g.key+'" data-val="'+esc(v)+'">'+esc(v)+(isSound?recChipPlay(v):'')+'</button>';
      }).join('')+'</div>'+(isSound?recEntry():'')+'</div>';
  }).join('')+recCard();
  return '<div class="card">'+html
    +'<button class="btn btn-primary btn-block" data-action="saveSample">保存</button>'
    +'<div class="hint center">声音、样式、横竖、是否中奖为必选，物品类型可不选</div></div>';
}

/* ================= 智能分析 ================= */
function entropy(p){
  if(p<=0||p>=1)return 0;
  return -p*Math.log2(p)-(1-p)*Math.log2(1-p);
}
function infoGain(vals){
  var total=0,wins=0;
  vals.forEach(function(v){total+=v.n;wins+=v.w;});
  var rem=0;
  vals.forEach(function(v){rem+=v.n/total*entropy(v.rate);});
  return entropy(wins/total)-rem;
}
function featureOrder(){
  var feats=[{key:'sound',label:'声音'},{key:'style',label:'样式'},{key:'orientation',label:'横竖'},{key:'itemType',label:'物品类型'}];
  var res=[];
  feats.forEach(function(f){
    var groups={};
    store.samples.forEach(function(s){
      var v=s[f.key]||'未填';
      (groups[v]=groups[v]||[]).push(s);
    });
    var vals=Object.keys(groups).map(function(v){
      var g=groups[v];
      var w=g.filter(function(x){return x.win;}).length;
      return {v:v,n:g.length,w:w,rate:w/g.length};
    }).sort(function(a,b){return b.rate-a.rate||b.n-a.n;});
    if(vals.length>1)res.push({key:f.key,label:f.label,ig:infoGain(vals),vals:vals});
  });
  /* 样式、横竖现场最好观察，固定优先；其余按区分度排序 */
  var PRIORITY={style:0,orientation:1,sound:2,itemType:2};
  res.sort(function(a,b){
    if(PRIORITY[a.key]!==PRIORITY[b.key])return PRIORITY[a.key]-PRIORITY[b.key];
    return b.ig-a.ig;
  });
  return res;
}
function genRules(){
  var feats=['sound','style','orientation','itemType'];
  var MIN=2;
  var candidates=[];
  feats.forEach(function(f){candidates.push([f]);});
  for(var i=0;i<feats.length;i++){
    for(var j=i+1;j<feats.length;j++){
      candidates.push([feats[i],feats[j]]);
      for(var k=j+1;k<feats.length;k++){
        candidates.push([feats[i],feats[j],feats[k]]);
      }
    }
  }
  var win=[],lose=[];
  candidates.forEach(function(keys){
    var groups={};
    store.samples.forEach(function(s){
      var key=keys.map(function(k){return s[k]||'未填';}).join('\u0001');
      (groups[key]=groups[key]||[]).push(s);
    });
    Object.keys(groups).forEach(function(key){
      var g=groups[key];
      if(g.length<MIN)return;
      var w=g.filter(function(x){return x.win;}).length;
      if(w===g.length||w===0){
        var text=key.split('\u0001').join(' + ');
        (w===g.length?win:lose).push({text:text,count:g.length,keys:keys.slice()});
      }
    });
  });
  win=dedupeRules(win);
  lose=dedupeRules(lose);
  /* 含样式/横竖的规律优先展示，其次按样本数排序 */
  var sortFn=function(a,b){
    var ap=(a.keys.indexOf('style')>=0||a.keys.indexOf('orientation')>=0)?0:1;
    var bp=(b.keys.indexOf('style')>=0||b.keys.indexOf('orientation')>=0)?0:1;
    if(ap!==bp)return ap-bp;
    return b.count-a.count||b.keys.length-a.keys.length;
  };
  win.sort(sortFn);lose.sort(sortFn);
  return {win:win.slice(0,8),lose:lose.slice(0,8)};
}
/* 去除冗余规律：若已有更短的特征组合是100%规律，则包含它的更长组合不再列出 */
function dedupeRules(list){
  var kept=[];
  list.slice().sort(function(a,b){return a.keys.length-b.keys.length||b.count-a.count;}).forEach(function(r){
    var sub=kept.some(function(k){
      return k.keys.every(function(x){return r.keys.indexOf(x)>=0;});
    });
    if(!sub)kept.push(r);
  });
  return kept;
}
function viewAnalysis(){
  var n=store.samples.length;
  if(!n)return '<div class="empty">样本库还是空的<br>录入样本后，这里会自动分析规律</div>';
  var w=store.samples.filter(function(s){return s.win;}).length;
  var rules=genRules();
  var html='<div class="card stats">共 '+n+' 条样本 · 总中奖率 '+fmtProb(n?w/n:0)+'</div>';
  html+='<div class="card"><div class="li-title" style="margin-bottom:2px">🎯 一定中奖</div>'
    +(rules.win.length?rules.win.map(function(r){
      return '<div class="rule-item win"><div class="rule-text">'+esc(r.text)+'</div><div class="rule-count">样本'+r.count+'条</div></div>';
    }).join(''):'<div class="li-sub" style="margin-top:8px">暂未发现样本数≥2的必中规律</div>')
    +'</div>';
  html+='<div class="card"><div class="li-title" style="margin-bottom:2px">🚫 一定不中奖</div>'
    +(rules.lose.length?rules.lose.map(function(r){
      return '<div class="rule-item lose"><div class="rule-text">'+esc(r.text)+'</div><div class="rule-count">样本'+r.count+'条</div></div>';
    }).join(''):'<div class="li-sub" style="margin-top:8px">暂未发现样本数≥2的必不中规律</div>')
    +'</div>';
  var order=featureOrder();
  html+='<div class="card"><div class="li-title" style="margin-bottom:2px">🧭 建议判断顺序</div>'
    +(order.length?order.map(function(o,i){
      return '<div class="order-item"><div class="order-head"><span class="order-num">'+(i+1)+'</span>先判断：'+o.label+'</div>'
        +'<div class="order-vals">'+o.vals.map(function(v){
          return '<span class="order-val"><b>'+esc(v.v)+'</b> '+fmtProb(v.rate)+'（'+v.w+'/'+v.n+'）</span>';
        }).join('')+'</div></div>';
    }).join(''):'<div class="li-sub" style="margin-top:8px">各特征中奖率相近，暂无明显规律，建议多录样本</div>')
    +'</div>';
  html+='<div class="hint center">规律基于现有样本库自动计算，样本越多越准 · 仅供辅助参考</div>';
  return html;
}

function parseBackup(text){
  var d=JSON.parse(text);
  if(!d||!Array.isArray(d.samples)||!Array.isArray(d.batches))throw new Error('bad');
  return {presets:Object.assign({},DEFAULT_PRESETS,d.presets||{}),samples:d.samples,batches:d.batches,
    recordings:(d.recordings&&typeof d.recordings==='object')?d.recordings:{}};
}
function exportData(){
  var blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='lucky-app-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('已导出备份文件');
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      store=parseBackup(reader.result);
      saveStore();
      render();
      toast('导入成功');
    }catch(e){
      toast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

/* ================= 云同步 ================= */
/* ================= 声音录音 =================
   录音按"声音名"保存，任何一个样本/样品选了该声音都能播放试听。
   录音存在 store.recordings 里，因此会自动跟着云同步走。 */
var REC_MAX_MS=5000;          /* 单条录音最长时长 */
var REC_TOTAL_WARN=400000;    /* 录音总量提醒阈值（字符数，约 300KB 音频） */
var recOpen=false;            /* 录音面板是否展开 */
var recTarget=null;           /* 当前为哪个声音录音/试听 */
var recState='idle';          /* idle | recording */
var mediaRec=null,recChunks=[],recStream=null,recTimer=null,recTick=null,recStartTs=0;
var curAudio=null,audioCtx=null;

function recs(){if(!store.recordings)store.recordings={};return store.recordings;}
function hasRec(sound){return !!(sound&&recs()[sound]);}
function recCount(){return Object.keys(recs()).length;}
function recTotalChars(){var t=0;var r=recs();Object.keys(r).forEach(function(k){t+=String((r[k]||{}).d||'').length;});return t;}
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}

function playRec(sound){
  var r=recs()[sound];
  if(!r){toast('「'+sound+'」还没有录音');return;}
  try{
    if(curAudio){try{curAudio.pause();}catch(e){}}
    curAudio=new Audio(r.d);
    var p=curAudio.play();
    if(p&&p.catch)p.catch(function(e){toast('播放失败：'+e.message);});
  }catch(e){toast('播放失败：'+e.message);}
}
function startRec(sound){
  if(!recSupported()){toast('这个浏览器不支持录音，请用手机自带浏览器打开本网址');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream=stream;
    recChunks=[];
    recTarget=sound;
    var MR=window.MediaRecorder;
    var opts={audioBitsPerSecond:16000};
    var mime='audio/webm;codecs=opus';
    try{
      mediaRec=(MR.isTypeSupported&&MR.isTypeSupported(mime))
        ?new MR(stream,Object.assign({mimeType:mime},opts))
        :new MR(stream,opts);
    }catch(e){mediaRec=new MR(stream);}
    mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data);};
    mediaRec.onstop=saveRec;
    mediaRec.start();
    recStartTs=Date.now();
    recState='recording';
    recTimer=setTimeout(stopRec,REC_MAX_MS);
    recTick=setInterval(function(){
      if(view.name!=='form'&&view.name!=='item'&&view.name!=='rec'){stopRec();return;}  /* 离开页面就停，别一直占着麦克风 */
      render();
    },200);
    render();
  }).catch(function(e){
    toast('无法录音：'+((e&&e.message)?e.message:'请允许使用麦克风'));
  });
}
function stopRec(){
  if(recState!=='recording'||!mediaRec)return;
  recState='idle';
  clearTimeout(recTimer);recTimer=null;
  clearInterval(recTick);recTick=null;
  try{mediaRec.stop();}catch(e){saveRec();}
}
function saveRec(){
  var sound=recTarget;
  recTarget=null;
  if(recStream){try{recStream.getTracks().forEach(function(t){t.stop();});}catch(e){}recStream=null;}
  var parts=recChunks,type=(mediaRec&&mediaRec.mimeType)||'audio/webm';
  mediaRec=null;recChunks=[];
  var blob=new Blob(parts,{type:type});
  if(!blob.size){toast('没有录到声音，请再试一次');render();return;}
  var fr=new FileReader();
  fr.onload=function(){
    recs()[sound]={d:fr.result,size:blob.size,at:Date.now()};
    saveStore();
    render();
    toast('已保存「'+sound+'」的录音（'+Math.max(1,Math.round(fr.result.length/1024))+'KB）');
  };
  fr.onerror=function(){toast('保存录音失败，请重试');render();};
  fr.readAsDataURL(blob);
}
function delRec(sound){
  if(!hasRec(sound))return;
  confirmModal('删除录音','确定删除「'+sound+'」的录音吗？只删录音，样本数据不受影响',function(){
    delete recs()[sound];
    saveStore();render();toast('已删除录音');
  });
}

  }).join('');

    body='<div class="rec-status"><span class="rec-dot"></span>正在录音：<b>'+esc(recTarget)+'</b> · '+el+' 秒（最长 '+(REC_MAX_MS/1000)+' 秒，会自动停止）</div>'
      +'<button class="btn btn-danger btn-block" data-action="stopRec">■ 停止并保存</button>';
  }else{
    var hasT=!!(recTarget&&r[recTarget]);
    body='<div class="rec-status">'+(recTarget?'已选：<b>'+esc(recTarget)+'</b>'+(hasT?'（已有录音，可试听或重录）':'（还没有录音）'):'先点上面一个声音，再按开始录音')+'</div>'
      +'<div class="rec-actions">'
      +'<button class="btn btn-primary" data-action="startRec"'+(recTarget?'':' disabled')+'>● 开始录音</button>'
      +'<button class="btn btn-ghost" data-action="playRec" data-val="'+esc(recTarget||'')+'"'+(hasT?'':' disabled')+'>▶ 试听</button>'
      +'<button class="btn btn-danger-ghost" data-action="delRec" data-val="'+esc(recTarget||'')+'"'+(hasT?'':' disabled')+'>删除</button>'
      +'</div>';
  }
  var total=recTotalChars();
  var warn=total>REC_TOTAL_WARN?'<div class="rec-warn">录音总量已约 '+Math.round(total/1024)+'KB，建议只保留常用的几个，否则同步会变慢</div>':'';
  return '<div class="rec-card"><div class="feat-label">选择要录音的声音（点一下选中，最长 '+(REC_MAX_MS/1000)+' 秒）</div>'
    +'<div class="chips">'+chips+'</div>'+body+warn
    +'<button class="btn btn-ghost btn-block" data-action="openRec">录音管理 / 导入现成录音</button>'

}

/* ---- 录音管理页：按"声音种类"管理，可录音也可导入现成文件 ---- */
var IMPORT_MAX_SEC=8;        /* 导入时最多保留前 8 秒 */
var IMPORT_RAW_MAX=80000;    /* 转码失败时，小于这个体积的文件原样保存 */
var impQueue=[],impBusy=false,impIdx=0;

function fmtKB(n){return Math.max(1,Math.round(n/1024))+'KB';}
function viewRec(){
  var r=recs();
  var rows=store.presets.sounds.map(function(s){
    var has=!!r[s];
    return '<div class="card list-item"><div class="li-main">'
      +'<div class="li-title">'+esc(s)+(has?' <span class="badge badge-win">已有录音</span>':'')+'</div>'

    +'<button class="btn btn-primary btn-block" data-action="importAudio"'+(impBusy?' disabled':'')+'>'
    +(impBusy?('正在处理第 '+(impIdx+1)+' 个…'):'📁 选择录音文件')+'</button>'
    +(total>REC_TOTAL_WARN?('<div class="rec-warn">录音总量已约 '+fmtKB(total)+'，建议只留常用的，否则同步会变慢</div>'):'')
    +'</div>';
  return head+recCard()+imp+impSaveCard()+rows;
}
/* 导入确认区：每个文件确认/指定对应哪个声音 */
function impSaveCard(){

  var rows=impQueue.map(function(x,i){

    +'<button class="btn btn-ghost btn-block" data-action="impClear">取消导入</button></div>';

function matchSound(base){
  var sounds=store.presets.sounds||[];
  var b=String(base).toLowerCase().trim();
  var exact=sounds.filter(function(s){return s.toLowerCase()===b;});
  if(exact.length)return exact[0];
  var hit=null;
  sounds.forEach(function(s){if(b.indexOf(s.toLowerCase())>=0&&(!hit||s.length>hit.length))hit=s;});
  return hit;
}
function getAudioCtx(){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();
  return audioCtx;
}
function fileToArrayBuffer(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(fr.result);};
    fr.onerror=function(){rej(new Error('读取失败'));};
    fr.readAsArrayBuffer(file);
  });
}
function blobToDataUrl(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(fr.result);};
    fr.onerror=function(){rej(new Error('转换失败'));};
    fr.readAsDataURL(blob);
  });
}
/* 把任意音频转成体积很小的 webm/opus（失败返回 null） */
function transcodeToOpus(file){
  var ctx=getAudioCtx();
  if(!ctx||!window.MediaRecorder||!ctx.createMediaStreamDestination)return Promise.resolve(null);
  return fileToArrayBuffer(file).then(function(buf){
    return new Promise(function(res,rej){
      ctx.decodeAudioData(buf,function(ab){res(ab);},function(){rej(new Error('无法解析'));});
    });
  }).then(function(ab){
    var dest=ctx.createMediaStreamDestination();
    var src=ctx.createBufferSource();
    src.buffer=ab;
    src.connect(dest);
    var MR=window.MediaRecorder;
    var mime='audio/webm;codecs=opus';
    var rec;
    try{rec=(MR.isTypeSupported&&MR.isTypeSupported(mime))?new MR(dest.stream,{mimeType:mime,audioBitsPerSecond:16000}):new MR(dest.stream);}
    catch(e){rec=new MR(dest.stream);}
    var chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    var dur=Math.max(0.3,Math.min(ab.duration,IMPORT_MAX_SEC));
    return new Promise(function(res){
      rec.onstop=function(){
        blobToDataUrl(new Blob(chunks,{type:rec.mimeType||'audio/webm'})).then(res,function(){res(null);});
      };
      rec.start();
      src.start();
      setTimeout(function(){
        try{src.stop();}catch(e){}
        try{rec.stop();}catch(e){}
      },dur*1000+120);
    });
  });
}
function handleImportFiles(files){
  var list=Array.prototype.slice.call(files||[]);
  if(!list.length)return;
  impBusy=true;impIdx=0;impQueue=[];render();
  var step=function(){
    if(impIdx>=list.length){
      impBusy=false;render();
      var ready=impQueue.filter(function(x){return x.d&&x.sound;}).length;
      toast(impQueue.length?('已处理 '+impQueue.length+' 个文件，其中 '+ready+' 个自动对上'):'没有读到文件');
      return;
    }
    var f=list[impIdx];
    var base=String(f.name).replace(/\.[^.]+$/,'');
    var guess=matchSound(base);
    transcodeToOpus(f).then(function(d){
      if(d){impQueue.push({name:f.name,d:d,size:d.length,sound:guess});impIdx++;render();return step();}
      if(f.size<=IMPORT_RAW_MAX){
        return blobToDataUrl(f).then(function(d2){
          impQueue.push({name:f.name,d:d2,size:f.size,sound:guess});
        },function(){
          impQueue.push({name:f.name,d:null,size:f.size,sound:guess,err:'读取失败'});
        }).then(function(){impIdx++;render();step();});
      }
      impQueue.push({name:f.name,d:null,size:f.size,sound:guess,err:'格式不支持（微信语音 amr/silk 需先转成 mp3）'});
      impIdx++;render();step();
    }).catch(function(){
      impQueue.push({name:f.name,d:null,size:f.size,sound:guess,err:'处理失败'});
      impIdx++;render();step();
    });
  };
  step();
}

/* ================= 云同步 ================= */
var TOKEN_KEY='luckyApp.token';
var LASTSYNC_KEY='luckyApp.lastSync';
var LASTSYNC_MSG_KEY='luckyApp.lastSyncMsg';
var DATA_REPO='xyy012/lucky-app-data';
var DATA_PATH='data.json';
var uploadTimer=null;
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}}
function setToken(t){try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}}
function clearToken(){try{localStorage.removeItem(TOKEN_KEY);}catch(e){}}
/* 记录同步结果：时间 + 结果文字，供设置页长期显示（提示条会消失，这里不会） */
function setLastSync(msg){
  try{
    localStorage.setItem(LASTSYNC_KEY,String(Date.now()));
    if(msg)localStorage.setItem(LASTSYNC_MSG_KEY,msg);
  }catch(e){}
}
function b64encode(s){
  var bytes=new TextEncoder().encode(s);
  var bin='';
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(s){
  var bin=atob(s);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghApi(path,opts){
  opts=opts||{};
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},15000);
  var init=Object.assign({},opts);
  /* 合并请求头，避免 opts.headers 覆盖掉认证头 */
  init.headers=Object.assign({'Authorization':'Bearer '+getToken(),'Accept':'application/vnd.github+json'},opts.headers||{});
  init.signal=ctrl.signal;
  init.cache='no-store';
  /* 带时间戳参数：让每次请求都是全新网址，任何缓存层都无法返回过期结果。
     （曾因此拿到缓存的 404，误以为云端没有文件，上传缺 sha 报 422） */
  var url='https://api.github.com/repos/'+DATA_REPO+'/contents/'+path+'?_='+Date.now();
  var p=fetch(url,init);
  /* 用两参数 then 清理定时器，避免产生未处理的 rejection */
  p.then(function(){clearTimeout(timer);},function(){clearTimeout(timer);});
  return p;
}
/* 取出 GitHub 返回的错误说明，便于用户看懂失败原因 */
function ghError(r){
  return r.json().then(function(j){
    return (j&&j.message)?String(j.message).replace(/\s+/g,' ').slice(0,60):'';
  },function(){return '';});
}
function fetchRemote(){
  return ghApi(DATA_PATH,{method:'GET'}).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)return ghError(r).then(function(d){throw new Error('拉取失败('+r.status+(d?'：'+d:'')+')');});
    return r.json().then(function(j){
      return {data:JSON.parse(b64decode(j.content)),sha:j.sha};
    });
  });
}
function putRemote(obj,sha){
  var json=JSON.stringify(obj);
  var enc=b64encode(json);
  /* GitHub 单次上传有大小限制，超大时给一句人话提示，而不是甩个看不懂的状态码 */
  if(enc.length>900000)throw new Error('数据太大（含录音约 '+Math.round(json.length/1024)+'KB），请在录音面板删掉几个不常用的再同步');
  var body={message:'sync',content:enc};
  if(sha)body.sha=sha;
  return ghApi(DATA_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    if(r.ok)return;
    return ghError(r).then(function(d){throw new Error('上传失败('+r.status+(d?'：'+d:'')+')');});
  });
}
/* 上传本地数据。返回 'pushed' | 'remote-newer'
   若因缺少 sha 被拒（422），说明本地拿到的云端状态过期了（例如被缓存成"云端无文件"），
   此时重新拉取取最新 sha 重新判断；若云端其实更新则不覆盖，交给拉取 */
function uploadIfNewer(remote){
  var doPut=function(sha){
    return putRemote(store,sha).then(function(){setLastSync('已上传');return 'pushed';});
  };
  return doPut(remote?remote.sha:null).catch(function(e){
    if(!/\(422/.test(e.message))throw e;
    return fetchRemote().then(function(fresh){
      if(!fresh||remoteIsNewer(fresh)||sameAsRemote(fresh))return 'remote-newer';
      return doPut(fresh.sha);
    });
  });
}
/* 数据量体重：样本数 + 批次数 + 批内样品数。
   旧版本数据的时间戳可能是 0，两端都是 0 时不能只比时间，否则会误判"已是最新"而永不拉取。 */
function storeWeight(d){
  if(!d)return -1;
  var n=(d.samples||[]).length+(d.batches||[]).length;
  (d.batches||[]).forEach(function(b){n+=(b.items||[]).length;});
  return n;
}
/* 判断云端是否比本地更新：时间戳大的胜；时间戳相同时数据多的胜 */
function remoteIsNewer(remote){
  if(!remote)return false;
  var localTs=store.updatedAt||0,remoteTs=remote.data.updatedAt||0;
  if(remoteTs!==localTs)return remoteTs>localTs;
  return storeWeight(remote.data)>storeWeight(store);
}
/* 两端时间戳和数据量都相同 → 无需同步 */
function sameAsRemote(remote){
  return !!remote&&(remote.data.updatedAt||0)===(store.updatedAt||0)&&storeWeight(remote.data)===storeWeight(store);
}
/* 改动后自动上传：只上传，绝不用云端覆盖本地刚改的数据 */
function pushLocal(){
  return fetchRemote().then(function(remote){
    if(remoteIsNewer(remote)||sameAsRemote(remote)){setLastSync('已是最新');return;}
    return uploadIfNewer(remote).then(function(res){
      if(res==='remote-newer')setLastSync('已是最新');
    });
  });
}
/* 改动后3秒自动上传 */
function scheduleUpload(){
  clearTimeout(uploadTimer);
  uploadTimer=setTimeout(function(){
    if(!getToken())return;
    pushLocal().catch(function(){return pushLocal();}).catch(function(){});
  },3000);
}
/* 执行一次同步。返回 'pulled' | 'pushed' | 'same' */
function syncOnce(depth){
  depth=depth||0;
  return fetchRemote().then(function(remote){
    if(remoteIsNewer(remote)){
      var d=remote.data;
      store={presets:Object.assign({},DEFAULT_PRESETS,d.presets||{}),samples:Array.isArray(d.samples)?d.samples:[],batches:Array.isArray(d.batches)?d.batches:[],recordings:(d.recordings&&typeof d.recordings==='object')?d.recordings:{},updatedAt:d.updatedAt||0};
      persistStore();
      setLastSync('已拉取云端数据');
      return 'pulled';
    }
    if(sameAsRemote(remote)){setLastSync('已是最新');return 'same';}
    return uploadIfNewer(remote).then(function(res){
      if(res!=='remote-newer')return 'pushed';
      /* 上传时发现云端其实更新（本地状态过期）→ 重新判断一次，改为拉取。
         加 depth 只重试一层，避免异常时来回打转 */
      if(depth)return 'same';
      return syncOnce(depth+1);
    });
  });
}
/* 手动同步：按修改时间取较新的一方 */
function syncNow(manual){
  var t=getToken();
  if(!t){if(manual)toast('请先在下方粘贴并保存 GitHub 密钥');return Promise.resolve(false);}
  return syncOnce().then(function(res){
    render();
    if(!manual)return true;
    toast(res==='pulled'?'已从云端拉取最新数据':(res==='pushed'?'已上传本地数据到云端':'两端数据已是最新'));
    return true;
  }).catch(function(e){
    var msg=(e.name==='AbortError')?'网络超时（15秒无响应）':e.message;
    setLastSync('失败：'+msg);
    render();
    if(manual)toast('同步失败：'+msg+'（检查网络或密钥）');
    return false;
  });
}
function syncStatusLine(){
  if(!getToken())return '状态：未配置（需在 GitHub 生成密钥）';
  var ls=localStorage.getItem(LASTSYNC_KEY);
  var msg=localStorage.getItem(LASTSYNC_MSG_KEY);
  if(!ls)return '状态：已配置 · 尚未同步过';
  return '状态：'+fmtTime(Number(ls))+(msg?' · '+esc(msg):'');
}

document.getElementById('importFile').addEventListener('change',function(e){
  if(e.target.files&&e.target.files[0])importData(e.target.files[0]);
  e.target.value='';
});
document.getElementById('audioFiles').addEventListener('change',function(e){
  if(e.target.files&&e.target.files.length)handleImportFiles(e.target.files);
  e.target.value='';
});
document.getElementById('backBtn').addEventListener('click',function(){
  if(view.name==='batch'){view={name:'batches'};}
  else if(view.name==='item'){view={name:'batch',batchId:view.batchId};}
  else if(view.name==='form'){view={name:'library',editSampleId:null};}
  else if(view.name==='rec'){view={name:'settings'};}
  render();
});
document.querySelectorAll('.tabbar button').forEach(function(b){
  b.addEventListener('click',function(){
    view={name:b.dataset.tab};
    render();
  });
});

/* ================= 注册 Service Worker（PWA 离线支持） ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    /* updateViaCache:'none' + 主动 update()：确保新版本立即生效，不被浏览器缓存挡住 */
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){
      reg.update().catch(function(){});
    }).catch(function(err){console.warn('SW注册失败：',err);});
  });
}

render();

/* 打开App时自动拉取云端最新数据 */
setTimeout(function(){
  if(getToken())syncNow(false);
},1200);
</script>
</body>
</html>
